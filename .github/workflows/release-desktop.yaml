name: "release-desktop"

on:
  push:
    tags:
      - "autosource/**"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  flutter-test:
    name: "Flutter test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    name: "Flutter analyze"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings
        shell: bash

  build-macos:
    name: "Release for macOS (unsigned)"
    needs: [flutter-test, flutter-analyze]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="manual-${GITHUB_RUN_ID}"
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "tag_safe=${tag//\//-}" >> "$GITHUB_ENV"
      - name: Echo build progress
        run: echo "Kazumi_macos_${{ env.tag_safe }}.dmg build progress"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
      - name: Create DMG
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/Kazumi.app
        continue-on-error: true
      - name: Rename DMG
        run: mv Kazumi*.dmg Kazumi_macos_${{ env.tag_safe }}.dmg
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos_outputs
          path: Kazumi_macos_*.dmg

  build-windows:
    name: "Release for Windows (unsigned)"
    needs: [flutter-test, flutter-analyze]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          } else {
            $tag = "manual-${env:GITHUB_RUN_ID}"
          }
          $tagSafe = $tag.Replace('/', '-')
          echo "tag=$tag" >> $env:GITHUB_ENV
          echo "tag_safe=$tagSafe" >> $env:GITHUB_ENV
      - run: echo "Kazumi_windows_${env:tag_safe}.zip build progress"
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      # windows-latest does not preinstall yq (macOS/Linux runners do), but
      # flutter-action with flutter-version-file needs it to parse pubspec.yaml.
      # Without this the "Set up Flutter" step fails with "yq not found".
      # Do not remove this step.
      - name: Install yq (required by flutter-action to parse flutter-version-file on Windows)
        run: choco install yq -y --no-progress
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "18"
      - run: flutter pub get
      - run: >-
          flutter build windows
          --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
      - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows_${env:tag_safe}.zip
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: Kazumi_windows_*.zip

  release:
    name: "Release (desktop, unsigned)"
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "tag=manual-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos_outputs
          path: macos_outputs
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: windows_outputs
      - name: List downloaded artifacts
        run: ls -l macos_outputs windows_outputs
        shell: bash
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Kazumi ${{ env.tag }} (desktop, unsigned)"
          draft: true
          make_latest: false
          body: |
            Unsigned desktop build (macOS + Windows only) from this fork. Not built
            through SignPath, so:

            - **macOS**: Gatekeeper will refuse to open the app. Right-click the app
              and choose "Open", or run `xattr -dr com.apple.quarantine Kazumi.app`
              after extracting the DMG.
            - **Windows**: SmartScreen will show an "unknown publisher" warning.
              Click "More info" then "Run anyway".
            - If the `DANDANAPI_*` / `KAZUMI_*` secrets are not configured on this
              repo, this build was compiled without danmaku/Kazumi API keys and those
              features may not work.
          files: |
            macos_outputs/*.dmg
            windows_outputs/*.zip
